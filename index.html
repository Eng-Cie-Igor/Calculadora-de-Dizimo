<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Dízimo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- Etapa 1: pergunta -->
    <div id="etapaPergunta">
      <h1>Calculadora de Dízimo</h1>
      <p class="pergunta">Quanto você ganhou esse mês?</p>

      <input type="text" inputmode="numeric" id="renda" placeholder="R$ 0,00" oninput="mascaraMoeda(this)">

      <button onclick="calcular()">Calcular</button>
    </div>

    <!-- Etapa 2: resultado (começa escondida) -->
    <div id="etapaResultado" class="escondido">
      <h1>Pronto! ✅</h1>
      <p class="resultadoTexto" id="fraseDizimo">Seu dízimo é R$ 0,00</p>
      

      <button onclick="calcularNovamente()">Calcular de novo</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
