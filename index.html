<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Dízimo</title>
  <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b8860b">
  <link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dízimo">
</head>
<body>

  <div class="container">

    <div id="etapaPergunta">
      <h1>Calculadora de Dízimo</h1>
      <p class="pergunta">Quanto você ganhou esse mês?</p>

      <input type="text" inputmode="numeric" id="renda" placeholder="R$ 0,00" oninput="mascaraMoeda(this)">

      <button onclick="calcular()">Calcular</button>
    </div>

    <div id="etapaResultado" class="escondido">
      <h1>Pronto! ✅</h1>
      <p class="resultadoTexto" id="fraseDizimo">Seu dízimo é R$ 0,00 Reais</p>
      
      <button onclick="calcularNovamente()">Calcular de novo</button>
    </div>

  </div>

  <script src="script.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
